# ============================================================================
#  Pesca — MineToy
# ============================================================================
#  Texto en minusculas normales. El plugin lo convierte a VERSALITAS al mostrarlo
#  (ver `small-caps` mas abajo), respetando etiquetas <color>, {placeholders} y
#  literales entre `backticks`. Escribe normal, se ve como el resto del servidor.
# ============================================================================

# Convierte automaticamente todo el texto visible a versalitas unicode.
# Los acentos se pierden (no existe versalita acentuada) y la ñ se deja tal cual.
small-caps: true

# ---------------------------------------------------------------------------
#  Pesca
# ---------------------------------------------------------------------------
fishing:
  # Solo se reemplaza la captura cuando el pez vanilla era un pez de verdad.
  # Con `false` tambien se reemplazan basura y tesoros dentro del area.
  only-replace-vanilla-fish: true

  # Curva del peso. 1.0 = uniforme. Valores mas altos hacen que los ejemplares
  # grandes sean cada vez mas raros. 2.4 da una distribucion agradable.
  weight-curve: 2.4

  # Efectos al capturar. Clave de sonido de minecraft, no el nombre del enum.
  effects:
    sound: 'minecraft:entity.player.levelup'
    # Solo suena si la rareza da al menos estos puntos. 0 = siempre suena.
    min-points: 8

  # Rarezas que se anuncian a todo el servidor al capturarlas.
  # Respeta /pesca admin broadcasts igual que los avisos del torneo.
  announce-rarities:
    - legendario
    - mitico

# ---------------------------------------------------------------------------
#  Torneo
# ---------------------------------------------------------------------------
tournament:
  # Cuanto dura un torneo. Formato: 30m, 2h, 1d, 1w
  duration: 2h
  # Cuanto se espera desde que termina uno hasta que empieza el siguiente.
  frequency: 1d
  # true / false / debug  — se puede cambiar en caliente con /pesca admin broadcasts
  broadcasts: true
  # Avisos de "quedan X" antes de que termine el torneo.
  reminders: [1h, 30m, 10m, 5m, 1m]
  # Cuantos puestos muestra /pesca top
  top-size: 10
  # Si el ganador esta desconectado, el botin se guarda y se entrega al entrar.
  deliver-loot-on-join: true

# ---------------------------------------------------------------------------
#  Economia (Vault)
# ---------------------------------------------------------------------------
economy:
  # precio final = precio-por-kg * kg * multiplicador-de-rareza
  currency-symbol: '$'

# ---------------------------------------------------------------------------
#  Rarezas
# ---------------------------------------------------------------------------
#  points  -> puntos de torneo por captura (SOLO la rareza puntua)
#  price-multiplier -> multiplica el precio de venta
# ---------------------------------------------------------------------------
rarities:
  comun:
    display: 'comun'
    color: '#a8b4b4'
    points: 1
    price-multiplier: 1.0
  poco_comun:
    display: 'poco comun'
    color: '#6eff4a'
    points: 3
    price-multiplier: 1.15
  raro:
    display: 'raro'
    color: '#55a8ff'
    points: 8
    price-multiplier: 1.35
  epico:
    display: 'epico'
    color: '#c154c1'
    points: 20
    price-multiplier: 1.6
  legendario:
    display: 'legendario'
    color: '#ffb01f'
    points: 50
    price-multiplier: 2.0
  mitico:
    display: 'mitico'
    color: '#ff4f7b'
    points: 120
    price-multiplier: 2.5

