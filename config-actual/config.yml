# ---------------------------------------------------------------------------
#  Cebo especial  (cubo de cebo)
# ---------------------------------------------------------------------------
#  Con al menos un cubo de cebo en el inventario, cada captura dentro del area
#  tiene una probabilidad de mejorar: la pieza sube de rareza y gana peso extra.
#  El cubo solo se gasta cuando el cebo actua de verdad.
# ---------------------------------------------------------------------------
bait:
  # Probabilidad de que el cebo actue: 1 entre N capturas.
  chance-one-in: 40
  # Escalones de rareza que sube la pieza (segun el orden de `rarities`).
  rarity-bump: 1
  # Peso extra que gana la pieza. 0.35 = +35 %
  weight-bonus: 0.35
  # Gastar un cubo cuando actua. Con `false` el cebo es permanente.
  consume-on-proc: true

# ---------------------------------------------------------------------------
#  Sedal  (reparacion de cañas)
# ---------------------------------------------------------------------------
#  Arrastra el sedal encima de una caña dañada y haz click: la caña recupera
#  durabilidad y se gasta una unidad de sedal.
# ---------------------------------------------------------------------------
repair:
  # Durabilidad que recupera la caña. 0.25 = 25 % del total.
  percent: 0.25

# ---------------------------------------------------------------------------
#  Nombres de encantamientos
# ---------------------------------------------------------------------------
#  La tienda oculta el texto vanilla de los encantamientos y dibuja el suyo con
#  estos nombres, para que no salga el lore duplicado ni en ingles.
#  Los niveles se escriben en numeros romanos; si el encantamiento solo tiene un
#  nivel (reparacion) no se escribe ninguno.
# ---------------------------------------------------------------------------
enchant-names:
  LUCK_OF_THE_SEA: 'suerte del mar'
  LURE: 'atraccion'
  MENDING: 'reparacion'
  UNBREAKING: 'irrompibilidad'
  EFFICIENCY: 'eficiencia'
  FORTUNE: 'fortuna'

# ---------------------------------------------------------------------------
#  Tienda  (/pesca shop)
# ---------------------------------------------------------------------------
#  slot     -> casilla del inventario (0 a rows*9-1)
#  material -> item que se vende
#  amount   -> cantidad por compra
#  price    -> coste en la economia de Vault
#  enchants -> opcional, `ENCANTAMIENTO: nivel`
#  bait     -> marca el item como cebo especial (ver la seccion `bait`)
#
#  El lore de precio, encantamientos y cebo se genera solo. En `lore` va unica-
#  mente la frase de sabor del objeto.
# ---------------------------------------------------------------------------
shop:
  title: 'tienda de pesca'
  rows: 5

  # Relleno del fondo. AIR para dejarlo vacio.
  filler: BLACK_STAINED_GLASS_PANE
  # Panel con el saldo del jugador. -1 para ocultarlo.
  balance-slot: 4
  # Boton de venta rapida. -1 para ocultarlo.
  sell-all-slot: 40

  items:
    caña_basica:
      slot: 11
      material: FISHING_ROD
      amount: 1
      price: 250.0
      name: 'caña basica'
      lore:
        - 'para empezar en el muelle'

    caña_experta:
      slot: 12
      material: FISHING_ROD
      amount: 1
      price: 4500.0
      name: 'caña experta'
      lore:
        - 'la caña de los que viven del mar'
      enchants:
        LUCK_OF_THE_SEA: 3
        LURE: 3
        MENDING: 1

    cubo_de_cebo:
      slot: 13
      material: TROPICAL_FISH_BUCKET
      amount: 1
      price: 900.0
      name: 'cubo de cebo'
      bait: true
      lore:
        - 'carnada viva del arrecife'

    barca:
      slot: 14
      material: OAK_BOAT
      amount: 1
      price: 120.0
      name: 'barca'
      lore:
        - 'para llegar donde pican los grandes'

    sedal:
      slot: 15
      material: STRING
      amount: 1
      price: 350.0
      name: 'sedal de repuesto'
      repair: true
      lore:
        - 'hilo trenzado para el carrete'
