# ============================================================================
#  Pesca — mensajes
# ============================================================================
#  Formato de chat MineToy. Escribe en MINUSCULAS NORMALES: el plugin convierte
#  el texto a versalitas al mostrarlo (`small-caps` en config.yml).
#
#  Nunca se convierte:
#    <etiquetas>     etiquetas de MiniMessage y valores como <jugador>
#    %placeholders%  de PlaceholderAPI
#    `entre comillas invertidas`  literales que el jugador teclea (comandos)
#
#  Reglas del formato:
#    - cada color va precedido de <reset> para que la negrita no se filtre
#    - vuelve a <white> despues de cada valor
#    - sin mayusculas y sin punto final
#    - un espacio tras el icono, uno a cada lado del bullet
#
#  Colores con significado:
#    #6d6d6d  estructura (bullets, parentesis, guiones)
#    #b6d9d8  valor principal (nombres, comandos, objetos)
#    white    texto de la frase
#    #c93434  negativo      #6eff4a  positivo
#    #85bb65  dinero        #fc54fc  duracion
#    #ffd439  valor secundario (cantidades, puestos, horas)
# ============================================================================

# Bloque icono + etiqueta + bullet. Se insertan con <pre:nombre>.
prefixes:
  pesca: ' 🎣 <reset><#5ec8d8><bold>pesca <reset><#6d6d6d>• '
  torneo: ' 🏆 <reset><#ffb01f><bold>torneo <reset><#6d6d6d>• '
  error: ' ✘ <reset><#c93434><bold>error <reset><#6d6d6d>• '
  banco: ' ⛃ <reset><#85bb65><bold>banco <reset><#6d6d6d>• '
  sistema: ' ✔ <reset><#fae7b5><bold>sistema <reset><#6d6d6d>• '

# ---------------------------------------------------------------------------
#  El pez como objeto
# ---------------------------------------------------------------------------
item:
  name: '<pez>'
  lore:
    - '<#6d6d6d>rareza <reset><rareza>'
    - '<#6d6d6d>peso <reset><#ffd439><kg>'
    - '<#6d6d6d>valor <reset><#85bb65><precio>'
    - '<barra> <reset><#6d6d6d><trofeo>'
    - ''
    - '<#6d6d6d>vale <reset><#b6d9d8><puntos> <reset><#6d6d6d>puntos de torneo'
    - '<#6d6d6d>pescado por <reset><#b6d9d8><pescador>'

  # Se añade debajo del lore normal solo si el cebo mejoro la pieza.
  lore-enhanced:
    - ''
    - '<#ffd439>✦ <reset><#ffd439>mejorado con cebo'
    - '<#6d6d6d>subio desde <reset><rareza_base>'

# ---------------------------------------------------------------------------
#  Pescar
# ---------------------------------------------------------------------------
fishing:
  caught: '<pre:pesca><white>has pescado <reset><pez> <reset><#6d6d6d>de <reset><#ffd439><kg> <reset><#6d6d6d>• <reset><#85bb65><precio>'
  bait-proc: '<pre:pesca><#ffd439>✦ <reset><white>el cebo ha actuado <reset><#6d6d6d>• <white>sube a <reset><rareza> <reset><white>y gana <reset><#ffd439><bonus> <reset><white>de peso <reset><#6d6d6d>(<reset><#ffd439><restantes> <reset><#6d6d6d>cubos)'
  total: '<pre:pesca><white>llevas <reset><#b6d9d8><puntos> <reset><white>puntos <reset><#6d6d6d>• <white>vas <reset><#ffd439>#<puesto>'
  announce: '<pre:pesca><reset><#b6d9d8><jugador> <reset><white>ha sacado <reset><pez> <reset><#6d6d6d>de <reset><#ffd439><kg> <reset><#6d6d6d>(<reset><rareza><reset><#6d6d6d>)'

